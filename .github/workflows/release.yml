name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + MCP Registry OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Check versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          srv=$(jq -r .version server.json)
          srv_pkg=$(jq -r '.packages[0].version' server.json)
          src=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" src/index.ts)
          echo "tag=$tag package.json=$pkg server.json=$srv/$srv_pkg src/index.ts=$src"
          for v in "$pkg" "$srv" "$srv_pkg" "$src"; do
            [ "$v" = "$tag" ] || { echo "::error::Version mismatch, expected $tag everywhere"; exit 1; }
          done

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
