name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + MCP Registry OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Check versions match tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          srv=$(jq -r .version server.json)
          srv_pkg=$(jq -r '.packages[0].version' server.json)
          src=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" src/index.ts)
          echo "tag=$tag package.json=$pkg server.json=$srv/$srv_pkg src/index.ts=$src"
          for v in "$pkg" "$srv" "$srv_pkg" "$src"; do
            [ "$v" = "$tag" ] || { echo "::error::Version mismatch, expected $tag everywhere"; exit 1; }
          done

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Skipped when the version is already on npm, so a release whose later steps
      # failed can be re-run without npm refusing to publish over it.
      - name: Publish to npm
        run: |
          version=$(jq -r .version package.json)
          if npm view "mcp-server-petkit@$version" version >/dev/null 2>&1; then
            echo "mcp-server-petkit@$version is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm can take minutes to make a new version visible ("being processed"), and the
      # MCP Registry rejects a version it can't find on npm yet.
      - name: Wait for the version to appear on npm
        run: |
          version=$(jq -r .version package.json)
          for i in $(seq 1 40); do
            npm view "mcp-server-petkit@$version" version >/dev/null 2>&1 && exit 0
            echo "not visible on npm yet, retrying in 30s ($i/40)"
            sleep 30
          done
          echo "::error::mcp-server-petkit@$version still not visible on npm after 20 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  image:
    # After publish, so the version check and tests have passed before anything is pushed.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
